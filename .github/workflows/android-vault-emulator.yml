name: Prueba Android real · ApiVault Cordova

on:
  push:
    branches:
      - ank/block-3-multiple-api
    paths:
      - "fuente-completa/decoded/**"
      - ".github/workflows/android-vault-emulator.yml"
      - ".github/scripts/android-vault-emulator.sh"
      - "docs/BLOQUE_5_AUDITORIA_PERSISTENCIA.md"
      - "docs/CONTINUIDAD_DESARROLLO.txt"
  pull_request:
    branches:
      - ank/block-3-multiple-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-emulator:
    name: Ciclo put/get/remove en emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar rama de trabajo
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/apktool.jar" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Inyectar harness efímero de CI y reconstruir APK
        shell: bash
        env:
          ANK_VAULT_TEST_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          set -euo pipefail
          export ANK_VAULT_TEST_SECRET="ANK-VAULT-CI-$(openssl rand -hex 24)-$ANK_VAULT_TEST_NONCE"
          python3 <<'PY'
          import json, os
          from pathlib import Path

          path = Path("fuente-completa/decoded/assets/www/index.html")
          html = path.read_text(encoding="utf-8")
          if html.count("</body>") != 1:
              raise SystemExit("No se encontró un único cierre body para inyectar el harness.")
          secret = json.dumps(os.environ["ANK_VAULT_TEST_SECRET"])
          harness = """
          <script>
          (function () {
            "use strict";
            var secret = SECRET_VALUE;
            var key = "__ank_ci_vault_probe_v1";
            var phaseKey = "__ank_ci_vault_phase_v1";
            window.__ANK_CI_TOOL_TEST__ = true;
            var reported = Object.create(null);
            function report(code) {
              if (reported[code]) return;
              reported[code] = true;
              console.log("ANK_VAULT_CI:" + code);
              document.documentElement.setAttribute("data-ank-vault-ci", code);
            }
            function fail(code) { report("FAIL_" + code); }
            function call(action, args, ok, bad) {
              try {
                cordova.exec(ok, function () { bad(); }, "System", action, args);
              } catch (_) { bad(); }
            }
            function runToolTests() {
              var attempts = 0;
              var timeout = setTimeout(function () { fail("TOOL_TEST_TIMEOUT"); }, 150000);
              function assert(ok, code) { if (!ok) throw new Error(code); }
              async function rejected(fn, code) {
                var didReject = false;
                try { await fn(); } catch (_) { didReject = true; }
                assert(didReject, code);
              }
              function waitForPanelTools() {
                var api = window.__ANK_CI_TOOL_TEST_API__;
                if (!api) {
                  attempts += 1;
                  if (attempts > 120) { clearTimeout(timeout); return fail("TOOL_API_UNAVAILABLE"); }
                  setTimeout(waitForPanelTools, 500);
                  return;
                }
                (async function () {
                  var step = "INIT";
                  var original = "alpha needle omega\nline-two";
                  var originalBackup = null;
                  var beforeRestoreBackup = null;
                  var beforeDeleteBackup = null;
                  var beforeMissingRestoreBackup = null;
                  try {
                    await api.init("ank-ci-tools");
                    step = "SEED";
                    await api.seed("probe.txt", original);
                    await api.seed("secret.txt", 'OPENAI_API_KEY="ANK-TOOL-CI-DUMMY-SECRET"');
                    step = "LIST";
                    var listing = await api.execute("project.list_files", { path: ".", maxDepth: 2 });
                    assert(listing.files.some(function (x) { return x.path === "probe.txt"; }), "LIST_MISSING_FILE");
                    step = "READ";
                    var read = await api.execute("project.read_file", { path: "probe.txt" });
                    assert(read.content === original && typeof read.digest === "string" && read.digest.indexOf("fnv1a32-") === 0, "READ_MISMATCH");
                    step = "SEARCH";
                    var found = await api.execute("project.search_files", { query: "needle", path: ".", maxResults: 10 });
                    assert(found.matches.some(function (x) { return x.path === "probe.txt" && x.line === 1; }), "SEARCH_MISMATCH");
                    step = "SECRET_REDACTION";
                    var secretRead = await api.execute("project.read_file", { path: "secret.txt" });
                    assert(secretRead.content.indexOf("ANK-TOOL-CI-DUMMY-SECRET") === -1 &&
                      secretRead.content.indexOf("[CLAVE OCULTA]") !== -1 && secretRead.digest === null, "SECRET_NOT_REDACTED");
                    step = "WRITE_REQUIRES_DIGEST";
                    await rejected(function () {
                      return api.execute("project.write_file", { path: "probe.txt", content: "unsafe overwrite" });
                    }, "WRITE_WITHOUT_DIGEST_ACCEPTED");
                    step = "BACKUP";
                    originalBackup = await api.backup("project.write_file", { path: "probe.txt" });
                    assert(originalBackup && originalBackup.created && originalBackup.id, "BACKUP_NOT_CREATED");
                    step = "WRITE";
                    await api.execute("project.write_file", {
                      path: "probe.txt", content: "updated safely", expectedDigest: read.digest
                    });
                    var changed = await api.execute("project.read_file", { path: "probe.txt" });
                    assert(changed.content === "updated safely", "WRITE_MISMATCH");
                    step = "RESTORE_BACKUP_BEFORE";
                    beforeRestoreBackup = await api.backup("project.restore_backup", { backupId: originalBackup.id });
                    assert(beforeRestoreBackup.created && beforeRestoreBackup.id, "RESTORE_ROLLBACK_NOT_CREATED");
                    step = "RESTORE";
                    await api.execute("project.restore_backup", { backupId: originalBackup.id });
                    var restored = await api.execute("project.read_file", { path: "probe.txt" });
                    assert(restored.content === original, "RESTORE_MISMATCH");
                    step = "DELETE_REQUIRES_DIGEST";
                    await rejected(function () {
                      return api.execute("project.delete_file", { path: "probe.txt" });
                    }, "DELETE_WITHOUT_DIGEST_ACCEPTED");
                    step = "BACKUP_BEFORE_DELETE";
                    beforeDeleteBackup = await api.backup("project.delete_file", { path: "probe.txt" });
                    step = "DELETE";
                    await api.execute("project.delete_file", { path: "probe.txt", expectedDigest: restored.digest });
                    await rejected(function () {
                      return api.execute("project.read_file", { path: "probe.txt" });
                    }, "DELETED_FILE_STILL_READABLE");
                    step = "BACKUP_BEFORE_MISSING_RESTORE";
                    beforeMissingRestoreBackup = await api.backup("project.restore_backup", { backupId: beforeDeleteBackup.id });
                    step = "RESTORE_AFTER_DELETE";
                    await api.execute("project.restore_backup", { backupId: beforeDeleteBackup.id });
                    var afterDeleteRestore = await api.execute("project.read_file", { path: "probe.txt" });
                    assert(afterDeleteRestore.content === original, "RESTORE_AFTER_DELETE_MISMATCH");
                    step = "CLEANUP";
                    await api.removeFile("probe.txt").catch(function () {});
                    await api.removeFile("secret.txt").catch(function () {});
                    for (var backup of [originalBackup, beforeRestoreBackup, beforeDeleteBackup, beforeMissingRestoreBackup]) {
                      if (backup && backup.id) await api.removeBackup(backup.id).catch(function () {});
                    }
                    clearTimeout(timeout);
                    report("STAGE3_TOOL_OK");
                  } catch (error) {
                    clearTimeout(timeout);
                    console.log("ANK_TOOL_CI_ERROR:" + step + ":" + String(error && error.message || "failure"));
                    fail("TOOL_" + step + "_FAILED");
                  }
                })();
              }
              waitForPanelTools();
            }
            document.addEventListener("deviceready", function () {
              var timer = setTimeout(function () { fail("CALLBACK_TIMEOUT"); }, 25000);
              var done = function (code) { clearTimeout(timer); report(code); };
              var phase = localStorage.getItem(phaseKey);
              if (!phase) {
                call("securePut", [key, secret], function () {
                  call("secureGet", [key], function (value) {
                    if (String(value) !== secret) return fail("FIRST_READ_MISMATCH");
                    localStorage.setItem(phaseKey, "written");
                    done("STAGE1_OK");
                  }, function () { fail("FIRST_GET_ERROR"); });
                }, function () { fail("PUT_ERROR"); });
                return;
              }
              if (phase !== "written") return fail("INVALID_PHASE");
              call("secureGet", [key], function (value) {
                if (String(value) !== secret) return fail("RESTART_READ_MISMATCH");
                call("secureRemove", [key], function () {
                  call("secureGet", [key], function (after) {
                    if (String(after) !== "") return fail("REMOVE_NOT_EMPTY");
                    localStorage.removeItem(phaseKey);
                    done("STAGE2_OK");
                    runToolTests();
                  }, function () { fail("POST_REMOVE_GET_ERROR"); });
                }, function () { fail("REMOVE_ERROR"); });
              }, function () { fail("RESTART_GET_ERROR"); });
            }, { once: true });
          })();
          </script>
          """.replace("SECRET_VALUE", secret)
          panel_path = Path("fuente-completa/decoded/assets/www/ank/ai.js")
          panel = panel_path.read_text(encoding="utf-8")
          footer = (
              "  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);\n"
              "  else iniciar();\n"
              "})();"
          )
          if panel.count(footer) != 1:
              raise SystemExit("No se encontró el cierre único del panel para instrumentar pruebas de herramientas.")
          test_hook = """
            if (window.__ANK_CI_TOOL_TEST__ === true) {
              window.__ANK_CI_TOOL_TEST_API__ = {
                init: function (project) {
                  var safe = window.ANKAIEngine.normalizarRutaProyecto(project, false);
                  return dirsIniciales().then(function () {
                    st.project = safe;
                    return conSistema('mkdirs', st.prefix + '/public/proyectos/' + safe);
                  });
                },
                seed: function (relative, content) {
                  var target = rutaLocalHerramienta(relative, false);
                  return conSistema('mkdirs', target.absolute.replace(/\\/[^\\/]+$/, '')).then(function () {
                    return escribir(target.absolute, content);
                  });
                },
                execute: function (name, args) {
                  return ejecutarHerramientaProyecto({ name: name, arguments: args || {} });
                },
                backup: function (name, args) {
                  return backupAntesDeHerramienta({ tool: name, arguments: args || {} });
                },
                removeFile: function (relative) {
                  return conSistema('deleteFile', rutaLocalHerramienta(relative, false).absolute);
                },
                removeBackup: function (id) {
                  return conSistema('deleteFile', rutaBackupHerramienta(id));
                }
              };
            }
          """
          panel_path.write_text(panel.replace(footer, test_hook + "\\n" + footer), encoding="utf-8")
          path.write_text(html.replace("</body>", harness + "\\n</body>"), encoding="utf-8")
          PY
          apktool b fuente-completa/decoded -o "$RUNNER_TEMP/CodigoANK-vault-ci-unsigned.apk"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          PACKAGE_NAME="$("$AAPT" dump badging "$RUNNER_TEMP/CodigoANK-vault-ci-unsigned.apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE_NAME" = "com.ank.codigoank" || { echo "Application ID inesperado: $PACKAGE_NAME"; exit 1; }
          LAUNCH_ACTIVITY="$("$AAPT" dump badging "$RUNNER_TEMP/CodigoANK-vault-ci-unsigned.apk" | sed -n "s/^launchable-activity: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test -n "$LAUNCH_ACTIVITY" || { echo "No se pudo detectar la actividad de inicio de la APK"; exit 1; }
          {
            echo "ANK_PACKAGE_NAME=$PACKAGE_NAME"
            echo "ANK_LAUNCH_ACTIVITY=$LAUNCH_ACTIVITY"
          } >> "$GITHUB_ENV"
          echo "Application ID verificado: $PACKAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Actividad de inicio detectada: $LAUNCH_ACTIVITY" >> "$GITHUB_STEP_SUMMARY"
          # Esta clave efímera solo sirve para instalar la build de prueba desde cero en el emulador.
          # Nunca reutilizarla para actualizaciones ni distribuir esta APK.
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ank-ci-debug.jks" -storepass android -keypass android -alias ank-ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=ANK CI,O=OpenAI,C=US"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/ank-ci-debug.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/CodigoANK-vault-ci.apk" "$RUNNER_TEMP/CodigoANK-vault-ci-unsigned.apk"
          "$APKSIGNER" verify "$RUNNER_TEMP/CodigoANK-vault-ci.apk"
          echo "APK temporal de CI reconstruida y firmada con una clave efímera. No es una release." >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar ciclo cifrado en emulador
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Emulator 37+ requires explicit opt-in when the GitHub Linux runner has no KVM.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 30
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/android-vault-emulator.sh
