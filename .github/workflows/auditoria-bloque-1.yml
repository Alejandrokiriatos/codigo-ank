name: Auditoría estática ANK · Bloque 1

on:
  push:
    branches:
      - "ank/**"
    paths:
      - ".github/workflows/auditoria-bloque-1.yml"
      - "docs/**"
      - "fuente-completa/bot/**"
      - "fuente-completa/ank-ai/**"
      - "fuente-completa/tools/**"
      - "fuente-completa/preview/**"
      - "fuente-completa/web/**"
      - "fuente-completa/decoded/assets/www/ank/**"
      - "fuente-completa/update/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Sintaxis JS y pruebas aisladas del bot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar rama de auditoría
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          pwd
          test -d fuente-completa
          test -d fuente-completa/decoded/assets/www/ank
          LIST="$RUNNER_TEMP/ank-js-files"
          find . -type f -name '*.js' -print0 > "$LIST"
          find . -type f -name '*.mjs' -print0 >> "$LIST"
          COUNT="$(python3 -c 'import sys; print(open(sys.argv[1], "rb").read().count(bytes([0])))' "$LIST")"
          if [ "$COUNT" -eq 0 ]; then
            echo "No se encontraron archivos JavaScript propios."
            find fuente-completa -maxdepth 5 -type f | head -80
            exit 1
          fi
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < "$LIST"
          echo "Sintaxis correcta en $COUNT archivos JavaScript/MJS."
          echo "### Sintaxis JavaScript" >> "$GITHUB_STEP_SUMMARY"
          echo "Correctos: $COUNT archivos." >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar pruebas del bot con API simulada
        working-directory: fuente-completa
        run: node bot/pruebas/prueba.js

      - name: Probar el motor API y comprobar el bundle Android
        working-directory: fuente-completa
        shell: bash
        run: |
          set -euo pipefail
          node --test ank-ai/engine.test.js
          node tools/build-ai.js --check
          cmp -s decoded/assets/www/ank/ai.js update/ank/ai.js
          cmp -s decoded/assets/www/ank/ai.css update/ank/ai.css
          if grep -RniE 'opencode|OpenCode' decoded/assets/www/ank update/ank; then
            echo "Se encontró código antiguo en el panel o su copia de publicación."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const manifest = require('./update/version.json');
          const ai = fs.readFileSync('decoded/assets/www/ank/ai.js', 'utf8');
          const updater = fs.readFileSync('decoded/assets/www/ank/upd.js', 'utf8');
          const boot = fs.readFileSync('decoded/assets/www/ank/boot-ai.js', 'utf8');
          const match = ai.match(/PANEL_VERSION = '([^']+)'/);
          if (!match) throw new Error('No se pudo leer la versión del panel');
          if (!boot.includes('ANK_AI_ENGINE_BUNDLE_BEGIN')) throw new Error('El arranque no valida el panel nuevo');
          if (!updater.includes('Actualizaciones web desactivadas temporalmente') ||
              !updater.includes('activo: function () { return false; }') ||
              /CLAVE_HEX|function hmac\(/.test(updater)) {
            throw new Error('El actualizador antiguo con HMAC comprometido no está completamente retirado');
          }
          console.log('Canal remoto desactivado sin clave HMAC; panel incluido:', match[1], 'manifiesto antiguo:', manifest.web);
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const registry = fs.readFileSync('decoded/assets/www/cordova_plugins.js', 'utf8');
          const plugin = fs.readFileSync('decoded/assets/www/plugins/cordova-plugin-advanced-http/www/advanced-http.js', 'utf8');
          const api = fs.readFileSync('decoded/assets/www/plugins/cordova-plugin-advanced-http/www/public-interface.js', 'utf8');
          const panel = fs.readFileSync('decoded/assets/www/ank/ai.js', 'utf8');
          const engine = fs.readFileSync('ank-ai/engine.js', 'utf8');
          const css = fs.readFileSync('decoded/assets/www/ank/ai.css', 'utf8');
          if (!registry.includes('"cordova.plugin.http"')) throw new Error('Cordova no registra cordova.plugin.http');
          if (!plugin.includes("require(pluginId + '.public-interface')")) throw new Error('El plugin HTTP no carga su interfaz pública');
          if (!api.includes('sendRequest: sendRequest') || !api.includes('function abort(')) throw new Error('La interfaz HTTP no expone envío/cancelación');
          if (!panel.includes('function clienteHttpNativo()') || !panel.includes('http: clienteHttpNativo()')) throw new Error('El panel no conecta el transporte nativo');
          if (!panel.includes("return st.apiConfigured;")) throw new Error('No se pudo verificar la carga de configuración API');
          if (!engine.includes("custom-json") || !engine.includes("ANK_AI_ENDPOINT_INSECURE") ||
              !engine.includes("ANK_AI_CUSTOM_HEADER_INVALID")) {
            throw new Error('El motor no contiene el adaptador JSON personalizado y sus validaciones de seguridad');
          }
          if (!panel.includes('option value="custom-json"')) throw new Error('El selector no ofrece API JSON personalizada');
          for (const id of ['ank-ai-custom-auth-header', 'ank-ai-custom-auth-prefix', 'ank-ai-custom-headers', 'ank-ai-custom-body', 'ank-ai-custom-response']) {
            if (!panel.includes('id="' + id + '"')) throw new Error('Falta el ajuste de API personalizada: ' + id);
          }
          if (!panel.includes('var noAuthCustom = protocol === \'custom-json\' && !customAuthHeader;')) {
            throw new Error('El panel no admite conexiones locales sin clave API');
          }
          if (!css.includes('.ank-ai-field textarea') || !css.includes('.ank-ai-custom')) {
            throw new Error('Faltan estilos para los ajustes de API personalizada');
          }
          if (!engine.includes('function validarComando(command)') || !engine.includes('validateCommand: validarComando')) {
            throw new Error('El motor no expone la política de validación de comandos');
          }
          if (!panel.includes('PROTOCOLO_COMANDO') || !panel.includes('ank:comando')) {
            throw new Error('Falta el protocolo de propuestas de comandos');
          }
          for (const token of ['function bloqueComando(', 'function ejecutarComandoPropuesto(', 'function descartarComando(', 'case \'ejecutar-comando\'', 'case \'descartar-comando\'']) {
            if (!panel.includes(token)) throw new Error('Falta el flujo de aprobación de comandos: ' + token);
          }
          if (!panel.includes('validateCommand(comando)') || !panel.includes('policy.command')) {
            throw new Error('El panel no valida el comando antes de enviarlo al terminal');
          }
          if (!panel.includes("var carpeta = '/public/proyectos/' + proyecto;") ||
              !panel.includes("var guion = 'cd ' + comilla(carpeta) + ' && ' + policy.command;")) {
            throw new Error('El comando no está limitado a la carpeta del proyecto');
          }
          if (!css.includes('.ank-ai-command') || !css.includes('.ank-ai-command-actions')) {
            throw new Error('Faltan estilos para las tarjetas de aprobación de comandos');
          }
          const configCheck = panel.indexOf('function chequearTodo()');
          const configLoad = panel.indexOf('return cargarConfigApi();', configCheck);
          const readyGate = panel.indexOf("document.addEventListener('deviceready'", panel.indexOf('function iniciar()'));
          if (configCheck < 0 || configLoad < configCheck || readyGate < 0) throw new Error('La configuración API no se restaura tras deviceready');
          console.log('Plugin HTTP Cordova registrado y conectado al asistente.');
          NODE
          test -s decoded/assets/www/plugins/com.foxdebug.acode.rk.exec.terminal/www/Terminal.js
          test -s decoded/assets/www/plugins/com.foxdebug.acode.rk.exec.terminal/www/Executor.js
          echo "Motor API verificado; plugin HTTP nativo registrado; bundle de publicación sincronizado; canal remoto bloqueado hasta re-firma; terminal/Executor conservados." >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar que el canal de actualización y el código fuente estén presentes
        shell: bash
        run: |
          set -euo pipefail
          test -s fuente-completa/update/version.json
          test -s fuente-completa/update/ank/ai.js
          test -s fuente-completa/update/ank/ai.css
          test -s fuente-completa/decoded/assets/www/ank/upd.js
          test -s fuente-completa/decoded/assets/www/ank/boot-ai.js
          test -s fuente-completa/decoded/assets/www/ank/ai.js
          node -e "const v=require('./fuente-completa/update/version.json'); if(!v.web || !v.ai || !v.css || !v.sig) process.exit(1); console.log('Canal del panel:', v.web)"

  apktool-rebuild:
    name: Reconstrucción diagnóstica (APK sin assets excluidos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar rama de auditoría
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Apktool 2.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/apktool.jar" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Registrar assets requeridos y omitidos
        shell: bash
        run: |
          set -euo pipefail
          MISSING=0
          if [ ! -f fuente-completa/decoded/assets/opencode/opencode-arm64.tar.gz ]; then
            echo "- Falta el binario OpenCode ARM64 incluido en la versión documentada." >> "$GITHUB_STEP_SUMMARY"
            MISSING=1
          fi
          if [ ! -d fuente-completa/decoded/assets/alpine_assets ]; then
            echo "- Falta el directorio de assets Alpine/AXS/proot." >> "$GITHUB_STEP_SUMMARY"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "**ADVERTENCIA: el APK reconstruido es solo diagnóstico y no es instalable/funcional como release.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Assets Linux principales presentes." >> "$GITHUB_STEP_SUMMARY"
          fi
          test -s fuente-completa/decoded/assets/www/plugins/com.foxdebug.acode.rk.exec.terminal/www/Terminal.js
          test -s fuente-completa/decoded/assets/www/plugins/com.foxdebug.acode.rk.exec.terminal/www/Executor.js

      - name: Reconstruir APK sin firmar
        shell: bash
        run: |
          set -euo pipefail
          apktool b fuente-completa/decoded -o "$RUNNER_TEMP/CodigoANK-reconstruido-unsigned.apk"
          test -s "$RUNNER_TEMP/CodigoANK-reconstruido-unsigned.apk"
          stat -c 'APK reconstruido: %s bytes' "$RUNNER_TEMP/CodigoANK-reconstruido-unsigned.apk"
          echo "Reconstrucción Apktool completada. Este APK queda sin firma release y no debe instalarse sobre la versión distribuida." >> "$GITHUB_STEP_SUMMARY"
