<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../decoded/assets/www/build/main.css">
<style>
  html,body{margin:0;height:100%;background:#0b1113;font-family:"Segoe UI",system-ui,sans-serif}
  .stage{width:390px;height:844px;margin:26px auto;position:relative;overflow:hidden;
         border:1px solid #223033;border-radius:14px;background:#0F1618;box-shadow:0 30px 70px rgba(0,0,0,.6)}
  header.tile{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;
              gap:10px;padding:0 12px;box-sizing:border-box;font-size:14px}
  .mono{width:22px;height:22px;border:1px solid #E0A458;color:#E0A458;display:grid;place-items:center;
        font:600 11px/1 monospace;letter-spacing:.06em}
  #sidebar{position:absolute;top:46px;bottom:46px;left:0;width:168px;padding:10px 0;box-sizing:border-box;font-size:13px}
  #sidebar .row{padding:9px 14px;color:#CFC8B8;display:flex;gap:9px;align-items:center}
  #sidebar .row.on{background:#16211F;box-shadow:inset 3px 0 0 #E0A458;color:#E7E0D2}
  #sidebar .row small{color:#5E6B69;font:11px monospace}
  .open-file-list{position:absolute;top:46px;left:168px;right:0;height:30px;display:flex;font-size:12px}
  .open-file-list .tab{padding:0 12px;display:flex;align-items:center;gap:6px;color:#8E8778;
                       background:#0D1517;border-right:1px solid #1E2C2E}
  .open-file-list .tab.active{color:#E7E0D2;background:#0F1618;box-shadow:inset 0 -2px 0 #E0A458}
  .ace_editor{position:absolute;top:76px;left:168px;right:0;bottom:46px;background:#0F1618;
              font:12.5px/1.65 "Meslo LG S","Fira Code",monospace;color:#C9C2B2;padding:10px 0;overflow:hidden}
  .ln{display:flex}
  .ln i{width:34px;text-align:right;padding-right:12px;color:#5E6B69;font-style:normal}
  .k{color:#E0A458}.s{color:#7FB3A7}.c{color:#5E6B69}.n{color:#C98A5B}
  footer{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;
         justify-content:space-around;font-size:17px;color:#B9B2A2}
  footer .on{color:#E0A458}
  .dialog{position:absolute;left:26px;right:26px;top:250px;padding:0;overflow:hidden;font-size:13px}
  .dialog-title{padding:12px 14px;font-weight:600}
  .dialog-body{padding:14px;color:#CFC8B8;line-height:1.5}
  .dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px}
  button{padding:8px 14px;cursor:default}
  .label{color:#E0A458;font:600 10px/1 "Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="stage">
    <header class="tile">
      <div class="mono">A/</div>
      <div style="flex:1">
        <div style="font-weight:600;letter-spacing:.02em">Código ANK</div>
        <div class="label" style="margin-top:3px">editor</div>
      </div>
      <div style="color:#8E8778;font-size:16px">⋮</div>
    </header>

    <div id="sidebar">
      <div class="row on"><span>▤</span> app.js <small>js</small></div>
      <div class="row"><span>▤</span> theme.css <small>css</small></div>
      <div class="row"><span>▤</span> index.html <small>html</small></div>
      <div class="row"><span>▸</span> build/</div>
      <div class="row"><span>▸</span> res/</div>
    </div>

    <div class="open-file-list">
      <div class="tab active">app.js</div>
      <div class="tab">theme.css</div>
    </div>

    <div class="ace_editor">
      <div class="ln"><i>1</i><span><span class="c">// Código ANK — capa visual</span></span></div>
      <div class="ln"><i>2</i><span><span class="k">const</span> tema = {</span></div>
      <div class="ln"><i>3</i><span>&nbsp;&nbsp;fondo: <span class="s">"#0F1618"</span>,</span></div>
      <div class="ln"><i>4</i><span>&nbsp;&nbsp;acento: <span class="s">"#E0A458"</span>,</span></div>
      <div class="ln"><i>5</i><span>&nbsp;&nbsp;radio: <span class="n">2</span></span></div>
      <div class="ln"><i>6</i><span>};</span></div>
      <div class="ln"><i>7</i><span></span></div>
      <div class="ln"><i>8</i><span><span class="k">export default</span> tema;</span></div>
    </div>

    <div class="dialog">
      <div class="dialog-title">Guardar cambios</div>
      <div class="dialog-body">¿Querés guardar <b>app.js</b> antes de cerrar?</div>
      <div class="dialog-actions">
        <button>Cancelar</button>
        <button>Guardar</button>
      </div>
    </div>

    <footer>
      <span class="on">▤</span><span>⌕</span><span>⑃</span><span>⚙</span>
    </footer>
  </div>
  <script src="../decoded/assets/www/ank/ank.js"></script>
</body>
</html>
